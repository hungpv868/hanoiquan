<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>/* BASE_HREF_AUTO — set <base> so the site works at root (local, custom domain) AND at /hanoiquan/ on GitHub Pages */(function(){var p=location.pathname,seg=p.split('/').filter(Boolean)[0];var base=(location.hostname.endsWith('github.io')&&seg)?'/'+seg+'/':'/';document.write('<base href="'+base+'">');})();</script>

  <meta name="theme-color" content="#1A1310">
  <title>404 · HaNoiQuan</title>
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap">
  <link rel="stylesheet" href="assets/css/base.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('hanoiquan-theme')
          || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
  <style>
    .e404 {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: var(--space-2xl) var(--gutter);
    }
    .e404__num {
      font-family: var(--font-display);
      font-size: clamp(6rem, 18vw, 14rem);
      font-style: italic;
      font-weight: 300;
      color: var(--accent-vermillion);
      line-height: 1;
    }
    .e404__title {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 300;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      margin-block: var(--space-md) var(--space-md);
    }
    .e404__lead { color: var(--ink-secondary); margin-bottom: var(--space-xl); }
    .e404 small { color: var(--ink-muted); display: block; margin-top: var(--space-md); }
    .e404 small + small { margin-top: 0; }
  </style>
</head>
<body data-page="404">
  <main class="e404" id="main">
    <div>
      <p class="e404__num">404</p>
      <h1 class="e404__title">Page introuvable.</h1>
      <p class="e404__lead">La page que vous cherchez n'existe pas — ou plus.</p>
      <a href="./" class="btn btn--primary">Retour à l'accueil</a>

      <small lang="en">— Page not found · <a href="en/" style="color: var(--accent-saffron)">Back home</a></small>
      <small lang="vi">— Không tìm thấy trang · <a href="vi/" style="color: var(--accent-saffron)">Về trang chủ</a></small>
    </div>
  </main>
</body>
</html>
